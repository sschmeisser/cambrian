name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-sync"
  cancel-in-progress: false

jobs:
  build-and-sync-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build Standalone Calendar Bundle
        run: |
          python3 build_calendar.py

      - name: Sync to gh-pages branch
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add index.html sports_calendar.html data/ public/ 2>/dev/null || true
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "build: compile calendar bundle [skip ci]"
            git push origin main
          fi
          git push origin main:gh-pages
